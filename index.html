<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGLECO - Módulo de Cumpleaños</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS (xlsx) para exportar a Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            igleco: {
              50: '#f0f4f9',
              100: '#d9e2ec',
              500: '#1e3a8a',
              700: '#1e293b',
              800: '#0f172a',
              accent: '#d97706'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- ENCABEZADO -->
  <header class="bg-slate-900 text-white border-b border-amber-500/30 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-amber-500/10 p-2 rounded-lg border border-amber-500/20 text-amber-400">
          <i data-lucide="calendar-heart" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-none tracking-wide text-white">IGLECO</h1>
          <p class="text-xs text-amber-400 font-medium">Ministerio de Membresía • Gestión de Cumpleaños</p>
        </div>
      </div>
      <div class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full text-slate-300 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        Servicio Listo
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    
    <!-- TARJETA DE DEPOSITAR ARCHIVO Y SELECTOR -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-end">
        
        <!-- Campo Adjuntar CSV -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2 flex items-center gap-2">
            <i data-lucide="file-up" class="w-4 h-4 text-amber-600"></i>
            1. Cargar Base de Datos Membresía (.csv)
          </label>
          <input type="file" id="csvFile" accept=".csv, .txt" 
            class="block w-full text-sm text-slate-500
              file:mr-4 file:py-2.5 file:px-4
              file:rounded-lg file:border-0
              file:text-sm file:font-semibold
              file:bg-slate-100 file:text-slate-700
              hover:file:bg-slate-200
              cursor-pointer border border-slate-300 rounded-lg bg-slate-50 focus:outline-none" />
        </div>

        <!-- Selector de Mes -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2 flex items-center gap-2">
            <i data-lucide="calendar" class="w-4 h-4 text-amber-600"></i>
            2. Seleccionar Mes a Filtrar
          </label>
          <select id="mesSelect" disabled
            class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5 focus:ring-amber-500 focus:border-amber-500 disabled:opacity-50 disabled:cursor-not-allowed">
            <option value="">-- Cargue primero el archivo CSV --</option>
            <option value="1">Enero</option>
            <option value="2">Febrero</option>
            <option value="3">Marzo</option>
            <option value="4">Abril</option>
            <option value="5">Mayo</option>
            <option value="6">Junio</option>
            <option value="7">Julio</option>
            <option value="8">Agosto</option>
            <option value="9">Septiembre</option>
            <option value="10">Octubre</option>
            <option value="11">Noviembre</option>
            <option value="12">Diciembre</option>
          </select>
        </div>

      </div>

      <!-- MAPEO OPCIONAL / ESTADO -->
      <div id="mapeoPanel" class="hidden mt-4 pt-4 border-t border-slate-100 bg-amber-50/50 p-4 rounded-lg border border-amber-200">
        <p class="text-xs font-semibold text-amber-800 mb-2 flex items-center gap-1">
          <i data-lucide="settings" class="w-3.5 h-3.5"></i> Verifique las columnas detectadas de su archivo:
        </p>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
          <div>
            <label class="text-slate-600 block mb-1">Celular:</label>
            <select id="mapCelular" class="w-full bg-white border border-slate-300 rounded p-1"></select>
          </div>
          <div>
            <label class="text-slate-600 block mb-1">Fecha Nacimiento:</label>
            <select id="mapFecha" class="w-full bg-white border border-slate-300 rounded p-1"></select>
          </div>
          <div>
            <label class="text-slate-600 block mb-1">Grupo:</label>
            <select id="mapGrupo" class="w-full bg-white border border-slate-300 rounded p-1"></select>
          </div>
          <div class="flex items-end">
            <button id="reprocesarBtn" class="w-full bg-amber-600 text-white font-medium py-1 px-2 rounded hover:bg-amber-700">
              Aplicar Mapeo
            </button>
          </div>
        </div>
      </div>

      <!-- MENSAJE Y EXPORTAR -->
      <div class="mt-6 pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-4">
        <div id="statusMessage" class="text-xs text-slate-500 flex items-center gap-1.5">
          <i data-lucide="info" class="w-4 h-4 text-slate-400"></i>
          Sube el archivo de registros para habilitar la consulta.
        </div>
        
        <button id="exportBtn" disabled 
          class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition flex items-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed shadow-sm">
          <i data-lucide="download" class="w-4 h-4"></i>
          Exportar Excel (.xlsx)
        </button>
      </div>
    </div>

    <!-- RESULTADOS -->
    <div id="resultadosContenedor" class="hidden">
      
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center
